name: Backend Security

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/tests/test_antifilter_bgp_collector.py'
      - 'services/vpn-test-agent/Dockerfile'
      - 'docs/evidence/partner-platform/stage3-outbox*'
      - 'docs/evidence/partner-platform/stage3-outbox*/**'
      - 'docs/evidence/releases/task1-task2-20260713/task2-runtime-fault-v2/**'
      - '.gitleaks.toml'
      - '.github/workflows/backend-security.yml'
      - 'scripts/security/validate_gitleaks_config.py'
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/tests/test_antifilter_bgp_collector.py'
      - 'services/vpn-test-agent/Dockerfile'
      - 'docs/evidence/partner-platform/stage3-outbox*'
      - 'docs/evidence/partner-platform/stage3-outbox*/**'
      - 'docs/evidence/releases/task1-task2-20260713/task2-runtime-fault-v2/**'
      - '.gitleaks.toml'
      - '.github/workflows/backend-security.yml'
      - 'scripts/security/validate_gitleaks_config.py'
  schedule:
    # Run weekly on Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  dependency-audit:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Install project dependencies
        run: pip install -e .

      - name: Run pip-audit
        run: |
          set +e
          pip-audit --skip-editable --format json --output audit-results.json
          json_rc=$?
          pip-audit --skip-editable --format columns
          columns_rc=$?
          if [ "${json_rc}" -ne 0 ] || [ "${columns_rc}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: backend/audit-results.json
          retention-days: 30

      - name: Confirm vulnerability gate passed
        run: pip-audit --skip-editable --format columns

  code-security:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install security tools
        run: pip install bandit ruff

      - name: Run Bandit security linter
        run: |
          set +e
          bandit -r src/ -ll -f json -o bandit-results.json
          json_rc=$?
          bandit -r src/ -ll -f txt
          text_rc=$?
          if [ "${json_rc}" -ne 0 ] || [ "${text_rc}" -ne 0 ]; then
            exit 1
          fi

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-results
          path: backend/bandit-results.json
          retention-days: 30

      - name: Run Ruff security rules
        run: ruff check src/ --select S --output-format=json > ruff-security.json

      - name: Upload Ruff security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ruff-security-results
          path: backend/ruff-security.json
          retention-days: 30

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gitleaks allowlist policy
        working-directory: .
        run: python scripts/security/validate_gitleaks_config.py

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # targetRules-scoped global allowlists require Gitleaks 8.25.0+.
          GITLEAKS_VERSION: 8.30.1
