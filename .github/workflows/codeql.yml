name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'admin/**'
      - 'partner/**'
      - 'backend/**'
      - 'services/**'
      - 'scripts/**'
      - 'infra/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/codeql.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'admin/**'
      - 'partner/**'
      - 'backend/**'
      - 'services/**'
      - 'scripts/**'
      - 'infra/**'
      - 'package.json'
      - 'package-lock.json'
      - '.node-version'
      - '.github/workflows/codeql.yml'
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
          config: |
            paths:
              - frontend/src
              - admin/src
              - partner/src
              - scripts
            paths-ignore:
              - frontend/node_modules
              - frontend/.next
              - frontend/dist
              - frontend/coverage
              - admin/node_modules
              - admin/.next
              - admin/dist
              - admin/coverage
              - partner/node_modules
              - partner/.next
              - partner/dist
              - partner/coverage

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web workspaces
        run: |
          npm run build -w frontend
          npm run build -w admin
          npm run build -w partner

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: true

      - name: Install jq
        if: always()
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          jq --version

      - name: Check for critical/high severity findings
        if: always()
        run: |
          SARIF_FILE="sarif-results/javascript-typescript.sarif"
          if [ ! -s "$SARIF_FILE" ]; then
            echo "::error::Expected CodeQL SARIF output is missing or empty: $SARIF_FILE"
            find sarif-results -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          CRITICAL_COUNT=$(jq 'def security_severity($rules; $r): (($r.properties."security-severity" // ([$rules[]? | select(.id == $r.ruleId) | .properties."security-severity"][0]) // "0") | tonumber); [.runs[] as $run | ($run.tool.driver.rules // []) as $rules | $run.results[] | . as $r | select(($r.level == "error") or (security_severity($rules; $r) >= 9.0))] | length' "$SARIF_FILE")
          HIGH_COUNT=$(jq 'def security_severity($rules; $r): (($r.properties."security-severity" // ([$rules[]? | select(.id == $r.ruleId) | .properties."security-severity"][0]) // "0") | tonumber); [.runs[] as $run | ($run.tool.driver.rules // []) as $rules | $run.results[] | . as $r | select((security_severity($rules; $r) >= 7.0) and (security_severity($rules; $r) < 9.0))] | length' "$SARIF_FILE")

          echo "Critical findings: $CRITICAL_COUNT"
          echo "High severity findings: $HIGH_COUNT"

          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::Found $CRITICAL_COUNT critical and $HIGH_COUNT high severity security findings"
            exit 1
          fi

  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended
          config: |
            paths:
              - backend/src
              - services/node-fleet-controller/src
              - services/task-worker/src
              - services/telegram-bot/src
              - services/vpn-test-agent/src
              - scripts
              - infra
            paths-ignore:
              - backend/.venv
              - backend/.pytest_cache
              - backend/dist
              - backend/coverage
              - services/**/.venv
              - services/**/.pytest_cache
              - services/**/dist
              - services/**/coverage
              - infra/**/.terraform

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.14'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/uv.lock
            services/*/pyproject.toml
            services/*/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
          output: sarif-results
          upload: true

      - name: Install jq
        if: always()
        run: |
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y jq
          fi
          jq --version

      - name: Check for critical/high severity findings
        if: always()
        run: |
          SARIF_FILE="sarif-results/python.sarif"
          if [ ! -s "$SARIF_FILE" ]; then
            echo "::error::Expected CodeQL SARIF output is missing or empty: $SARIF_FILE"
            find sarif-results -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          CRITICAL_COUNT=$(jq 'def security_severity($rules; $r): (($r.properties."security-severity" // ([$rules[]? | select(.id == $r.ruleId) | .properties."security-severity"][0]) // "0") | tonumber); [.runs[] as $run | ($run.tool.driver.rules // []) as $rules | $run.results[] | . as $r | select(($r.level == "error") or (security_severity($rules; $r) >= 9.0))] | length' "$SARIF_FILE")
          HIGH_COUNT=$(jq 'def security_severity($rules; $r): (($r.properties."security-severity" // ([$rules[]? | select(.id == $r.ruleId) | .properties."security-severity"][0]) // "0") | tonumber); [.runs[] as $run | ($run.tool.driver.rules // []) as $rules | $run.results[] | . as $r | select((security_severity($rules; $r) >= 7.0) and (security_severity($rules; $r) < 9.0))] | length' "$SARIF_FILE")

          echo "Critical findings: $CRITICAL_COUNT"
          echo "High severity findings: $HIGH_COUNT"

          if [ "$CRITICAL_COUNT" -gt 0 ] || [ "$HIGH_COUNT" -gt 0 ]; then
            echo "::error::Found $CRITICAL_COUNT critical and $HIGH_COUNT high severity security findings"
            exit 1
          fi

  all-checks:
    name: All CodeQL Checks Passed
    runs-on: ubuntu-latest
    needs: [analyze-javascript, analyze-python]
    if: always()
    steps:
      - name: Check all jobs
        env:
          JS_RESULT: ${{ needs.analyze-javascript.result }}
          PY_RESULT: ${{ needs.analyze-python.result }}
        run: |
          if [[ "$JS_RESULT" != "success" ]] || [[ "$PY_RESULT" != "success" ]]; then
            echo "One or more CodeQL analysis jobs failed"
            exit 1
          fi
          echo "All CodeQL security checks passed"
