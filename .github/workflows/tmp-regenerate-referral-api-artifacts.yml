name: Temporary referral API artifact regeneration

on:
  push:
    branches:
      - fix/referral-attribution-persistence-20260619
    paths:
      - .github/workflows/tmp-regenerate-referral-api-artifacts.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out referral branch
        uses: actions/checkout@v4
        with:
          ref: fix/referral-attribution-persistence-20260619
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin/package-lock.json
            partner/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install --no-cache-dir -e .

      - name: Install client dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix admin
          npm ci --prefix partner

      - name: Regenerate OpenAPI and client types
        env:
          CRYPTOBOT_TOKEN: dummy_cryptobot_token
          DATABASE_URL: postgresql+asyncpg://x:x@localhost:5432/x
          JWT_SECRET: generated_artifact_referral_dummy_secret_at_least_32_chars
          REDIS_URL: redis://localhost:6379/0
          REMNAWAVE_TOKEN: dummy_token_for_referral_artifact_generation
          REMNAWAVE_WEBHOOK_SECRET: dummy_webhook_secret_for_referral_artifact_generation
          SWAGGER_ENABLED: 'true'
        run: |
          python backend/scripts/export_openapi.py
          npm run --prefix frontend generate:api-types
          npm run --prefix admin generate:api-types
          npm run --prefix partner generate:api-types

      - name: Commit generated artifacts and remove temporary workflow
        run: |
          rm .github/workflows/tmp-regenerate-referral-api-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/tmp-regenerate-referral-api-artifacts.yml \
            backend/docs/api/openapi.json \
            frontend/src/lib/api/generated/types.ts \
            admin/src/lib/api/generated/types.ts \
            partner/src/lib/api/generated/types.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate API artifacts for referral attribution"
          git push origin HEAD:fix/referral-attribution-persistence-20260619
