remnawave:
  includeHiddenHosts: false
mixed-port: 7890
allow-lan: false
bind-address: 127.0.0.1
mode: rule
log-level: info
ipv6: false
tcp-concurrent: true
unified-delay: true
keep-alive-interval: 30
enable-process: true
find-process-mode: always
external-controller: 127.0.0.1:9090
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
  skip-dst-address:
  - 0.0.0.0/8
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.88.99.0/24
  - 192.168.0.0/16
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/3
  - ::/127
  - fc00::/7
  - fe80::/10
  - ff00::/8
tun:
  enable: true
  stack: gvisor
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  - tcp://any:53
  route-exclude-address:
  - 0.0.0.0/8
  - 10.0.0.0/8
  - 100.64.0.0/10
  - 127.0.0.0/8
  - 169.254.0.0/16
  - 172.16.0.0/12
  - 192.0.0.0/24
  - 192.0.2.0/24
  - 192.88.99.0/24
  - 192.168.0.0/16
  - 198.51.100.0/24
  - 203.0.113.0/24
  - 224.0.0.0/3
  - ::/127
  - fc00::/7
  - fe80::/10
  - ff00::/8
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - rule-set:geosite-private
  - +.lan
  - +.local
  - +.localhost
  - +.msftconnecttest.com
  - +.msftncsi.com
  - stun.*.*
  - stun.*.*.*
  - time.windows.com
  - time.nist.gov
  - time.apple.com
  - time1.apple.com
  - time2.apple.com
  - time3.apple.com
  - time4.apple.com
  - time5.apple.com
  - time6.apple.com
  - time7.apple.com
  - time.google.com
  - time1.google.com
  - time2.google.com
  - time3.google.com
  - time4.google.com
  - pool.ntp.org
  - ntp.ubuntu.com
  - +.xboxlive.com
  - '*.*.stun.playstation.net'
  - xbox.*.*.microsoft.com
  - speedtest.cros.wr.pvp.net
  default-nameserver:
  - https://77.88.8.8/dns-query
  - https://8.8.8.8/dns-query
  - https://1.1.1.1/dns-query
  proxy-server-nameserver:
  - system
  - https://8.8.8.8/dns-query
  - https://1.1.1.1/dns-query
  - https://77.88.8.8/dns-query
  direct-nameserver:
  - system
  - https://77.88.8.8/dns-query
  - https://8.8.8.8/dns-query
  nameserver:
  - https://8.8.8.8/dns-query#🌍 World / EU
  - https://1.1.1.1/dns-query#🌍 World / EU
  nameserver-policy:
    rule-set:geosite-private:
    - system
    rule-set:catalog-access-inline:
    - https://8.8.8.8/dns-query#🌍 World / EU
    - https://1.1.1.1/dns-query#🌍 World / EU
    rule-set:oisd-big:
    - rcode://name_error
    rule-set:ads-all:
    - rcode://name_error
    rule-set:win-spy:
    - rcode://name_error
    rule-set:tracker-domains-inline:
    - rcode://name_error
    rule-set:tor-inline:
    - rcode://name_error
    rule-set:manual-eu-inline:
    - https://8.8.8.8/dns-query#🌍 World / EU
    - https://1.1.1.1/dns-query#🌍 World / EU
    rule-set:youtube:
    - https://8.8.8.8/dns-query#🌍 World / EU
    - https://1.1.1.1/dns-query#🌍 World / EU
    rule-set:discord-domains:
