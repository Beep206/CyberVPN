proxy-providers:
  remnawave-ru:
    type: http
    url: https://redacted.invalid/ru
    path: ./providers/remnawave-ru.yaml
    filter: "(?i)(ru|moscow|spb|premium_smart_ru)"
  remnawave-de:
    type: http
    url: https://redacted.invalid/de
    path: ./providers/remnawave-de.yaml
    filter: "(?i)(de|germany|xhttp)"
  remnawave-global:
    type: http
    url: https://redacted.invalid/global
    path: ./providers/remnawave-global.yaml
    filter: "(?i)(nl|de|global|xhttp)"
proxy-groups:
  - name: "🇩🇪 DE Auto"
    type: url-test
    use: ["remnawave-de"]
    filter: "(?i)(de|germany|xhttp)"
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: "🇷🇺 RU Sites"
    type: url-test
    use: ["remnawave-ru"]
    filter: "(?i)(ru|moscow|spb|premium_smart_ru)"
    url: https://ya.ru
    interval: 300
  - name: "🌍 Global Auto"
    type: url-test
    use: ["remnawave-global"]
    filter: "(?i)(nl|de|global|xhttp)"
    url: https://www.gstatic.com/generate_204
    interval: 300
  - name: "🧲 Torrents"
    type: select
    proxies: ["REJECT"]
dns:
  enable: true
  enhanced-mode: fake-ip
  nameserver:
    - https://dns.google/dns-query
    - https://cloudflare-dns.com/dns-query
rules:
  - DOMAIN-SUFFIX,gosuslugi.ru,🇷🇺 RU Sites
  - DOMAIN-SUFFIX,nalog.gov.ru,🇷🇺 RU Sites
