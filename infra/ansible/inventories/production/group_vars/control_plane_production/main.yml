---
control_plane_stack_environment: production
control_plane_stack_remnawave_preupgrade_auth_secret_sha256: >-
  {{ control_plane_remnawave_preupgrade_auth_secret_sha256 | default('', true) }}
control_plane_stack_project_name: control-plane

control_plane_stack_release_name: "{{ control_plane_release_name | default('', true) }}"
control_plane_stack_release_source_commit: "{{ control_plane_release_source_commit | default('', true) }}"
control_plane_stack_remnawave_image: "{{ control_plane_release_images.remnawave | default('', true) }}"
control_plane_stack_backend_image: "{{ control_plane_release_images.backend | default('', true) }}"
control_plane_stack_worker_image: "{{ control_plane_release_images.worker | default('', true) }}"
control_plane_stack_helix_adapter_image: "{{ control_plane_release_images.helix_adapter | default('', true) }}"
control_plane_stack_node_image: "{{ control_plane_release_images.node | default('', true) }}"
control_plane_stack_subscription_page_image: "{{ control_plane_release_images.subscription_page | default('', true) }}"
control_plane_stack_node_ssh_proxy_image: "{{ control_plane_release_images.node_ssh_proxy | default('', true) }}"
control_plane_stack_subscription_page_rollback_image: remnawave/subscription-page:7.2.6@sha256:da5ee26ec70ecd81e57303993e8bfb74c8e52f2fa74644b84aad53324cde2e8c
control_plane_stack_release_supply_chain: "{{ control_plane_release_supply_chain | default({}, true) }}"
control_plane_stack_enforce_immutable_images: true
control_plane_stack_registry_logins: >-
  {{
    [
      {
        'registry_url': 'ghcr.io',
        'username': vault_control_plane_registry_username | default(''),
        'password': vault_control_plane_registry_password | default(''),
        'reauthorize': false
      }
    ]
  }}

control_plane_stack_enable_remnawave: true
control_plane_stack_enable_postgres: true
control_plane_stack_enable_valkey: true
control_plane_stack_enable_db_backup: true
control_plane_stack_enable_backend: true
control_plane_stack_enable_worker: true
control_plane_stack_enable_scheduler: true
control_plane_stack_enable_helix_adapter: true
control_plane_stack_enable_subscription_page: true
control_plane_node_ssh_enabled: false
control_plane_stack_enable_node_ssh_proxy: "{{ control_plane_node_ssh_enabled | bool }}"

control_plane_public_base_url: https://panel.example.com
control_plane_panel_domain: panel.example.com
control_plane_subscription_domain: cyber-vpn.org/api/sub
control_plane_stack_vpn_test_agent_url: ""
control_plane_stack_vpn_test_agent_moscow_url: ""
control_plane_stack_vpn_test_agent_spb_url: ""

control_plane_postgres_user: cybervpn
control_plane_postgres_db: cybervpn
control_plane_postgres_password: "{{ vault_control_plane_postgres_password }}"

control_plane_stack_remnawave_env: >-
  {{
    {
      'APP_PORT': '3000',
      'METRICS_PORT': '3001',
      'POSTGRES_USER': control_plane_postgres_user,
      'POSTGRES_PASSWORD': control_plane_postgres_password,
      'POSTGRES_DB': control_plane_postgres_db,
      'FRONT_END_DOMAIN': control_plane_panel_domain,
      'PANEL_DOMAIN': control_plane_panel_domain,
      'SUB_PUBLIC_DOMAIN': control_plane_subscription_domain,
      'HELIX_ENABLED': 'true',
      'HELIX_ADAPTER_PORT': control_plane_stack_helix_adapter_port | string,
      'HELIX_INTERNAL_AUTH_TOKEN': vault_control_plane_helix_internal_auth_token,
      'HELIX_REMNAWAVE_TOKEN': vault_control_plane_helix_remnawave_token,
      'APP_SECRET': vault_control_plane_remnawave_app_secret,
      'EXPORT_TO_STREAM_ENABLED': 'true',
      'EXPORT_TO_STREAM_MAXLEN': '3000',
      'SHORT_UUID_METHOD': 'nanoid',
      'SHORT_UUID_LENGTH': '16',
      'METRICS_USER': vault_control_plane_remnawave_metrics_user,
      'METRICS_PASS': vault_control_plane_remnawave_metrics_pass,
      'CYBERVPN_NODE_SSH_BROKER_ENABLED': (control_plane_node_ssh_enabled | bool) | ternary('true', 'false'),
      'CYBERVPN_NODE_SSH_BROKER_SECRET': vault_control_plane_remnawave_node_ssh_broker_secret | default(''),
      'CYBERVPN_NODE_SSH_BROKER_TRUSTED_PROXY_RANGES': (control_plane_node_ssh_enabled | bool) | ternary(control_plane_stack_node_ssh_proxy_ipv4, '')
    } | combine(vault_control_plane_remnawave_env_extra | default({}))
  }}

control_plane_stack_subscription_page_env: >-
  {{
    {
      'APP_PORT': control_plane_stack_subscription_page_app_port | string,
      'REMNAWAVE_PANEL_URL': 'http://remnawave:3000',
      'REMNAWAVE_API_TOKEN': vault_control_plane_subscription_page_remnawave_api_token,
      'CUSTOM_SUB_PREFIX': 'api/sub',
      'TRUST_PROXY': control_plane_stack_subscription_page_subnet,
      'PM2_HOME': '/tmp/pm2',
      'MARZBAN_LEGACY_LINK_ENABLED': 'false'
    } | combine(vault_control_plane_subscription_page_env_extra | default({}))
  }}

control_plane_stack_backend_env: >-
  {{
    {
      'DATABASE_URL': 'postgresql+asyncpg://' ~ control_plane_postgres_user ~ ':' ~ control_plane_postgres_password ~ '@remnawave-db:5432/' ~ control_plane_postgres_db,
      'REDIS_URL': 'redis://remnawave-redis:6379/0',
      'REMNAWAVE_URL': 'http://remnawave:3000',
      'REMNAWAVE_TOKEN': vault_control_plane_backend_remnawave_token,
      'REMNAWAVE_WEBHOOK_SECRET': vault_control_plane_backend_remnawave_webhook_secret,
      'WEBHOOK_LOG_FINGERPRINT_SECRET': vault_control_plane_backend_webhook_log_fingerprint_secret,
      'REMNAWAVE_WEBHOOK_MAX_BODY_BYTES': vault_control_plane_backend_remnawave_webhook_max_body_bytes | default('65536'),
      'REMNAWAVE_STREAM_INGESTION_ENABLED': 'true',
      'REMNAWAVE_STREAM_IP_HMAC_SECRET': vault_control_plane_backend_remnawave_stream_ip_hmac_secret,
      'REMNAWAVE_CONNECTION_DROP_HMAC_SECRET': vault_control_plane_backend_remnawave_connection_drop_hmac_secret,
      'REMNAWAVE_STREAM_CONSUMER_GROUP': 'cybervpn-remnawave-v1',
      'REMNAWAVE_STREAM_RECEIPT_RETENTION_DAYS': '14',
      'REMNAWAVE_USER_USAGE_RETENTION_DAYS': '180',
      'REMNAWAVE_SUBSCRIPTION_REQUEST_RETENTION_DAYS': '30',
      'REMNAWAVE_NODE_CONNECTIONS_RETENTION_DAYS': '30',
      'REMNAWAVE_NODE_SSH_ENABLED': (control_plane_node_ssh_enabled | bool) | ternary('true', 'false'),
      'REMNAWAVE_NODE_SSH_BROKER_URL': (control_plane_node_ssh_enabled | bool) | ternary('http://' ~ control_plane_stack_node_ssh_proxy_container_name ~ ':' ~ (control_plane_stack_node_ssh_proxy_port | string), ''),
      'REMNAWAVE_NODE_SSH_BROKER_SECRET': vault_control_plane_remnawave_node_ssh_broker_secret | default(''),
      'REMNAWAVE_NODE_SSH_TRUSTED_ADMIN_IDS': vault_control_plane_backend_remnawave_node_ssh_trusted_admin_ids | default(''),
      'REMNAWAVE_NODE_SSH_ALLOWED_NODE_IDS': vault_control_plane_backend_remnawave_node_ssh_allowed_node_ids | default(''),
      'REMNAWAVE_NODE_SSH_TICKET_TTL_SECONDS': '15',
      'REMNAWAVE_NODE_SSH_SESSION_MAX_SECONDS': '1800',
      'REMNAWAVE_NODE_SSH_REVOCATION_POLL_SECONDS': '0.5',
      'PASSKEY_ENABLED': vault_control_plane_backend_passkey_enabled | default('false'),
      'PASSKEY_ADMIN_ENABLED': vault_control_plane_backend_passkey_admin_enabled | default('false'),
      'REMNAWAVE_SMART_RU_EXTERNAL_SQUAD_UUID': vault_control_plane_backend_remnawave_smart_ru_external_squad_uuid | default(''),
      'REMNAWAVE_SMART_RU_INTERNAL_SQUAD_UUID': vault_control_plane_backend_remnawave_smart_ru_internal_squad_uuid | default(''),
      'REMNAWAVE_SMART_RU_PLAN_CODES': vault_control_plane_backend_remnawave_smart_ru_plan_codes | default('premium_smart_ru'),
      'REMNAWAVE_SMART_RU_SUBSCRIPTION_TEMPLATE_NAME': vault_control_plane_backend_remnawave_smart_ru_subscription_template_name | default('CyberVPN Premium Smart RU'),
      'REMNAWAVE_ABUSE_AUTO_DISABLE_ENABLED': vault_control_plane_backend_remnawave_abuse_auto_disable_enabled | default('false'),
      'REMNAWAVE_ABUSE_TORRENT_DISABLE_AFTER': vault_control_plane_backend_remnawave_abuse_torrent_disable_after | default('2'),
      'REMNAWAVE_ABUSE_TORRENT_WINDOW_HOURS': vault_control_plane_backend_remnawave_abuse_torrent_window_hours | default('24'),
      'HELIX_ENABLED': 'true',
      'HELIX_ADAPTER_URL': 'http://helix-adapter:8088',
      'HELIX_ADAPTER_TOKEN': vault_control_plane_helix_internal_auth_token,
      'JWT_SECRET': vault_control_plane_backend_jwt_secret,
      'CRYPTOBOT_TOKEN': vault_control_plane_backend_cryptobot_token,
      'TELEGRAM_BOT_TOKEN': vault_control_plane_backend_telegram_bot_token,
      'TELEGRAM_BOT_USERNAME': vault_control_plane_backend_telegram_bot_username,
      'TELEGRAM_BOT_INTERNAL_SECRET': vault_control_plane_backend_telegram_bot_internal_secret,
      'BACKEND_INTERNAL_SECRET': vault_control_plane_backend_internal_secret,
      'VPN_TEST_AGENT_URL': control_plane_stack_vpn_test_agent_url | default(''),
      'VPN_TEST_AGENT_SECRET': vault_control_plane_vpn_test_agent_secret | default(''),
      'VPN_TEST_AGENT_MOSCOW_URL': control_plane_stack_vpn_test_agent_moscow_url | default(''),
      'VPN_TEST_AGENT_MOSCOW_SECRET': vault_control_plane_vpn_test_agent_moscow_secret | default(''),
      'VPN_TEST_AGENT_SPB_URL': control_plane_stack_vpn_test_agent_spb_url | default(''),
      'VPN_TEST_AGENT_SPB_SECRET': vault_control_plane_vpn_test_agent_spb_secret | default(''),
      'PAYMENT_SETTLEMENT_WORKER_SECRET': vault_control_plane_backend_payment_settlement_worker_secret,
      'ENVIRONMENT': control_plane_stack_environment,
      'LOG_LEVEL': 'INFO',
      'CORS_ORIGINS': control_plane_public_base_url,
      'OAUTH_WEB_BASE_URL': control_plane_public_base_url,
      'SWAGGER_ENABLED': 'false',
      'DEBUG': 'false',
      'TOTP_ENCRYPTION_KEY': vault_control_plane_backend_totp_encryption_key,
      'OAUTH_TOKEN_ENCRYPTION_KEY': vault_control_plane_backend_oauth_token_encryption_key
    } | combine(vault_control_plane_backend_env_extra | default({}))
  }}

control_plane_stack_worker_env: >-
  {{
    {
      'DATABASE_URL': 'postgresql+asyncpg://' ~ control_plane_postgres_user ~ ':' ~ control_plane_postgres_password ~ '@remnawave-db:5432/' ~ control_plane_postgres_db,
      'REDIS_URL': 'redis://remnawave-redis:6379/0',
      'REMNAWAVE_STREAM_CONSUMER_ENABLED': 'true',
      'REMNAWAVE_STREAM_REDIS_URL': 'redis://remnawave-redis:6379/0',
      'REMNAWAVE_STREAM_CONSUMER_GROUP': 'cybervpn-remnawave-v1',
      'REMNAWAVE_STREAM_IP_HMAC_SECRET': vault_control_plane_backend_remnawave_stream_ip_hmac_secret,
      'REMNAWAVE_STREAM_RECEIPT_RETENTION_DAYS': '14',
      'REMNAWAVE_STREAM_CHECKPOINT_OBSERVE_INTERVAL_SECONDS': '30',
      'REMNAWAVE_URL': 'http://remnawave:3000',
      'REMNAWAVE_API_TOKEN': vault_control_plane_worker_remnawave_api_token,
      'HELIX_ENABLED': 'true',
      'HELIX_ADAPTER_URL': 'http://helix-adapter:8088',
      'HELIX_ADAPTER_TOKEN': vault_control_plane_helix_internal_auth_token,
      'BACKEND_API_URL': 'http://cybervpn-backend:8000/api/v1',
      'BACKEND_INTERNAL_SECRET': vault_control_plane_backend_internal_secret,
      'VPN_TEST_AGENT_URL': control_plane_stack_vpn_test_agent_url | default(''),
      'VPN_TEST_AGENT_SECRET': vault_control_plane_vpn_test_agent_secret | default(''),
      'VPN_TEST_AGENT_MOSCOW_URL': control_plane_stack_vpn_test_agent_moscow_url | default(''),
      'VPN_TEST_AGENT_MOSCOW_SECRET': vault_control_plane_vpn_test_agent_moscow_secret | default(''),
      'VPN_TEST_AGENT_SPB_URL': control_plane_stack_vpn_test_agent_spb_url | default(''),
      'VPN_TEST_AGENT_SPB_SECRET': vault_control_plane_vpn_test_agent_spb_secret | default(''),
      'TELEGRAM_BOT_INTERNAL_SECRET': vault_control_plane_backend_telegram_bot_internal_secret,
      'PAYMENT_SETTLEMENT_WORKER_SECRET': vault_control_plane_backend_payment_settlement_worker_secret,
      'TELEGRAM_BOT_TOKEN': vault_control_plane_worker_telegram_bot_token,
      'CRYPTOBOT_TOKEN': vault_control_plane_worker_cryptobot_token,
      'ADMIN_TELEGRAM_IDS': vault_control_plane_worker_admin_telegram_ids,
      'WORKER_CONCURRENCY': '2',
      'LOG_LEVEL': 'INFO',
      'METRICS_PORT': control_plane_stack_worker_metrics_port | string,
      'METRICS_PROTECT': 'false',
      'PROMETHEUS_MULTIPROC_DIR': '/tmp/prometheus-multiproc',
      'MAGIC_LINK_BASE_URL': control_plane_public_base_url
    } | combine(vault_control_plane_worker_env_extra | default({}))
  }}

control_plane_stack_scheduler_env: >-
  {{
    control_plane_stack_worker_env | combine({
      'REMNAWAVE_STREAM_CONSUMER_ENABLED': 'false'
    })
  }}

control_plane_stack_helix_adapter_env: >-
  {{
    {
      'ADAPTER_BIND_ADDR': '0.0.0.0:8088',
      'REMNAWAVE_URL': 'http://remnawave:3000',
      'REMNAWAVE_TOKEN': vault_control_plane_helix_adapter_remnawave_token,
      'DATABASE_URL': 'postgresql://' ~ control_plane_postgres_user ~ ':' ~ control_plane_postgres_password ~ '@remnawave-db:5432/' ~ control_plane_postgres_db,
      'DATABASE_MAX_CONNECTIONS': '10',
      'DATABASE_ACQUIRE_TIMEOUT_SECONDS': '5',
      'METRICS_PREFIX': control_plane_stack_helix_adapter_metrics_prefix,
      'INTERNAL_AUTH_TOKEN': vault_control_plane_helix_internal_auth_token,
      'MANIFEST_SIGNING_KEY': vault_control_plane_manifest_signing_key,
      'MANIFEST_SIGNING_KEY_ID': 'sig-key-production',
      'MANIFEST_TTL_SECONDS': '3600',
      'DEFAULT_ROLLOUT_CHANNEL': 'stable',
      'LOG_LEVEL': 'info'
    } | combine(vault_control_plane_helix_adapter_env_extra | default({}))
  }}

control_plane_stack_db_backup_env:
  POSTGRES_HOST: remnawave-db
  POSTGRES_DB: "{{ control_plane_postgres_db }}"
  POSTGRES_USER: "{{ control_plane_postgres_user }}"
  POSTGRES_PASSWORD: "{{ control_plane_postgres_password }}"
  POSTGRES_EXTRA_OPTS: --format=custom --compress=6
  BACKUP_SUFFIX: .dump
  SCHEDULE: "{{ control_plane_stack_db_backup_schedule }}"
  BACKUP_KEEP_DAYS: "{{ control_plane_stack_db_backup_keep_days | string }}"
  TZ: UTC
