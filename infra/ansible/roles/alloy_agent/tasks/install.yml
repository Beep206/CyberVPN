---
- name: Alloy | Install APT prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Alloy | Ensure keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Alloy | Fetch Grafana APT key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /tmp/grafana-alloy.gpg.key
    mode: "0644"

- name: Alloy | Dearmor Grafana APT key
  ansible.builtin.command:
    argv:
      - gpg
      - --dearmor
      - --yes
      - --output
      - /etc/apt/keyrings/grafana.gpg
      - /tmp/grafana-alloy.gpg.key
    creates: /etc/apt/keyrings/grafana.gpg
  register: alloy_agent_gpg_key

- name: Alloy | Remove legacy Grafana APT repository list
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ alloy_agent_apt_repo_filename }}.list"
    state: absent
  register: alloy_agent_legacy_apt_repository

- name: Alloy | Configure Grafana APT repository
  ansible.builtin.deb822_repository:
    name: "{{ alloy_agent_apt_repo_filename }}"
    types:
      - deb
    uris:
      - "{{ alloy_agent_apt_repo_uri }}"
    suites:
      - "{{ alloy_agent_apt_repo_suite }}"
    components: "{{ alloy_agent_apt_repo_components }}"
    signed_by: /etc/apt/keyrings/grafana.gpg
    state: present
    mode: "0644"
    install_python_debian: true
  register: alloy_agent_apt_repository

- name: Alloy | Refresh apt cache after repository change
  ansible.builtin.apt:
    update_cache: true
  when: alloy_agent_legacy_apt_repository is changed or alloy_agent_apt_repository is changed

- name: Alloy | Install Grafana Alloy package
  ansible.builtin.apt:
    name: alloy
    state: present
