---
- name: Docker | Assert Ubuntu target
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Ubuntu"
    fail_msg: "The docker role currently supports Ubuntu hosts only."

- name: Docker | Install repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Docker | Ensure apt keyring directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Docker | Install Docker apt GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: true

- name: Docker | Remove legacy Docker apt repository list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  register: docker_legacy_apt_repository

- name: Docker | Configure Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types:
      - deb
    uris:
      - https://download.docker.com/linux/ubuntu
    suites:
      - "{{ ansible_facts.distribution_release }}"
    components:
      - stable
    architectures:
      - "{{ docker_repo_arch_map.get(ansible_facts.architecture, 'amd64') }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    mode: "0644"
    install_python_debian: true
  register: docker_apt_repository
  vars:
    docker_repo_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf

- name: Docker | Refresh apt cache after repository change
  ansible.builtin.apt:
    update_cache: true
  when: docker_legacy_apt_repository is changed or docker_apt_repository is changed
  vars:
    ansible_apt_update_cache_retries: 3
