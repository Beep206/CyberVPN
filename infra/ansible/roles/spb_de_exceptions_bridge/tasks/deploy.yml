---
- name: Task2 SPB DE exceptions | Ensure bridge support group exists
  ansible.builtin.group:
    name: "{{ spb_de_exceptions_bridge_service_group }}"
    system: true
    state: present

- name: Task2 SPB DE exceptions | Ensure bridge support user exists
  ansible.builtin.user:
    name: "{{ spb_de_exceptions_bridge_service_user }}"
    group: "{{ spb_de_exceptions_bridge_service_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
    password: "!"
    groups: []
    append: false
    state: present

- name: Task2 SPB DE exceptions | Assert bridge port is free before first activation
  ansible.builtin.command:
    argv:
      - /usr/bin/ss
      - -H
      - -lntu
      - "sport = :{{ spb_de_exceptions_bridge_port }}"
  register: spb_de_exceptions_bridge_port_listeners
  changed_when: false
  failed_when: spb_de_exceptions_bridge_port_listeners.stdout | trim | length > 0
  when: spb_de_exceptions_bridge_run_port_preflight | bool

- name: Task2 SPB DE exceptions | Ensure nftables include directory exists
  ansible.builtin.file:
    path: "{{ spb_de_exceptions_bridge_nftables_include_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: spb_de_exceptions_bridge_manage_nftables | bool

- name: Task2 SPB DE exceptions | Render peer-only nftables rules
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ spb_de_exceptions_bridge_nftables_include_path }}"
    owner: root
    group: root
    mode: "0644"
  register: spb_de_exceptions_bridge_nft_template
  when: spb_de_exceptions_bridge_manage_nftables | bool

- name: Task2 SPB DE exceptions | Validate peer-only nftables rules
  ansible.builtin.command:
    argv:
      - /usr/sbin/nft
      - -c
      - -f
      - "{{ spb_de_exceptions_bridge_nftables_include_path }}"
  changed_when: false
  when: spb_de_exceptions_bridge_manage_nftables | bool

- name: Task2 SPB DE exceptions | Install firewall systemd unit
  ansible.builtin.template:
    src: cybervpn-spb-de-exceptions-firewall.service.j2
    dest: "/etc/systemd/system/{{ spb_de_exceptions_bridge_firewall_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
  register: spb_de_exceptions_bridge_firewall_unit_template
  when: spb_de_exceptions_bridge_manage_nftables | bool

- name: Task2 SPB DE exceptions | Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - spb_de_exceptions_bridge_manage_nftables | bool
    - not ansible_check_mode

- name: Task2 SPB DE exceptions | Enable peer-only firewall before Remnawave node restart
  ansible.builtin.systemd:
    name: "{{ spb_de_exceptions_bridge_firewall_unit_name }}.service"
    enabled: true
    state: "{{ 'restarted' if (spb_de_exceptions_bridge_nft_template.changed or spb_de_exceptions_bridge_firewall_unit_template.changed) else 'started' }}"
  when:
    - spb_de_exceptions_bridge_manage_nftables | bool
    - not ansible_check_mode

- name: Task2 SPB DE exceptions | Allow bridge TCP from SPB peer via UFW
  community.general.ufw:
    rule: allow
    proto: tcp
    from_ip: "{{ item }}"
    to_port: "{{ spb_de_exceptions_bridge_port }}"
    comment: CyberVPN Task2 SPB DE exceptions bridge TCP
  loop: "{{ spb_de_exceptions_bridge_allowed_ipv4_cidrs + spb_de_exceptions_bridge_allowed_ipv6_cidrs }}"
  when: spb_de_exceptions_bridge_manage_ufw | bool

- name: Task2 SPB DE exceptions | Allow bridge UDP from SPB peer via UFW
  community.general.ufw:
    rule: allow
    proto: udp
    from_ip: "{{ item }}"
    to_port: "{{ spb_de_exceptions_bridge_port }}"
    comment: CyberVPN Task2 SPB DE exceptions bridge UDP
  loop: "{{ spb_de_exceptions_bridge_allowed_ipv4_cidrs + spb_de_exceptions_bridge_allowed_ipv6_cidrs }}"
  when: spb_de_exceptions_bridge_manage_ufw | bool

- name: Task2 SPB DE exceptions | Remove deprecated IPv4 bridge TCP allows
  community.general.ufw:
    rule: allow
    delete: true
    proto: tcp
    from_ip: "{{ item }}"
    to_port: "{{ spb_de_exceptions_bridge_port }}"
  loop: "{{ spb_de_exceptions_bridge_deprecated_ipv4_cidrs }}"
  when: spb_de_exceptions_bridge_manage_ufw | bool

- name: Task2 SPB DE exceptions | Remove deprecated IPv4 bridge UDP allows
  community.general.ufw:
    rule: allow
    delete: true
    proto: udp
    from_ip: "{{ item }}"
    to_port: "{{ spb_de_exceptions_bridge_port }}"
  loop: "{{ spb_de_exceptions_bridge_deprecated_ipv4_cidrs }}"
  when: spb_de_exceptions_bridge_manage_ufw | bool
