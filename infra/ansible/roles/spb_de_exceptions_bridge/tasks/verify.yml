---
- name: Task2 SPB DE exceptions | Validate nftables rules
  ansible.builtin.command:
    argv:
      - /usr/sbin/nft
      - -c
      - -f
      - "{{ spb_de_exceptions_bridge_nftables_include_path }}"
  changed_when: false
  when: spb_de_exceptions_bridge_manage_nftables | bool

- name: Task2 SPB DE exceptions | Check bridge port is not wildcard-open outside policy
  ansible.builtin.command:
    argv:
      - /usr/sbin/nft
      - list
      - table
      - inet
      - "{{ spb_de_exceptions_bridge_nftables_table_name }}"
  changed_when: false
  register: spb_de_exceptions_bridge_nft_output
  when: spb_de_exceptions_bridge_manage_nftables | bool

- name: Task2 SPB DE exceptions | Assert rendered firewall contains TCP and UDP peer drops
  ansible.builtin.assert:
    that:
      - "'tcp dport 9444' in spb_de_exceptions_bridge_nft_output.stdout"
      - "'udp dport 9444' in spb_de_exceptions_bridge_nft_output.stdout"
      - >-
        spb_de_exceptions_bridge_nft_output.stdout is search(
          '(?m)^\\s*tcp dport 9444 counter .* drop$'
        )
      - >-
        spb_de_exceptions_bridge_nft_output.stdout is search(
          '(?m)^\\s*udp dport 9444 counter .* drop$'
        )
    fail_msg: "Task2 bridge firewall must include TCP/UDP 9444 peer-only drop rules."
  when: spb_de_exceptions_bridge_manage_nftables | bool
