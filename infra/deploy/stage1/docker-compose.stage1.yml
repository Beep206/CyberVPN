name: cybervpn-stage1

x-stage-labels: &stage-labels
  cybervpn.environment: ${CYBERVPN_ENVIRONMENT:-production}
  cybervpn.stage: stage1
  cybervpn.release: ${CYBERVPN_IMAGE_TAG:-stage1-beta-rc.1}

x-runtime-defaults: &runtime-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: ${STAGE1_LOG_MAX_SIZE:-50m}
      max-file: "${STAGE1_LOG_MAX_FILES:-5}"
      labels: cybervpn.service,cybervpn.environment,cybervpn.stage,cybervpn.release

x-app-env: &app-env
  env_file:
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/app.env
      required: false
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/payments.env
      required: false
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/remnawave.env
      required: false
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/sentry-runtime.env
      required: false

x-web-env: &web-env
  env_file:
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/frontend.env
      required: false
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/sentry-runtime.env
      required: false

x-admin-env: &admin-env
  env_file:
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/admin.env
      required: false
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/sentry-runtime.env
      required: false

x-partner-env: &partner-env
  env_file:
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/partner.env
      required: false
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/sentry-runtime.env
      required: false

x-bot-env: &bot-env
  env_file:
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/telegram-bot.env
      required: false
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/payments.env
      required: false
    - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/sentry-runtime.env
      required: false

services:
  cybervpn-caddy:
    <<: *runtime-defaults
    profiles: ["container-edge"]
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${CYBERVPN_CONFIG_DIR:-/srv/cybervpn-h/configs/app}/Caddyfile.stage1.snippet:/etc/caddy/Caddyfile:ro
      - cybervpn-caddy-data:/data
      - cybervpn-caddy-config:/config
    networks:
      cybervpn-public: {}
      cybervpn-backend: {}
      cybervpn-egress: {}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --header='Host: cyber-vpn.net' http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-caddy
      cybervpn.metrics.target: blackbox_http_probe

  cybervpn-backend:
    <<: *runtime-defaults
    image: ${CYBERVPN_IMAGE_REGISTRY:-local}/cybervpn-backend:${CYBERVPN_IMAGE_TAG:-stage1-beta-rc.1}
    env_file:
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/app.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/payments.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/remnawave.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/sentry-runtime.env
        required: false
    expose:
      - "8000"
      - "9091"
    ports:
      - "127.0.0.1:18080:8000"
      - "127.0.0.1:19091:9091"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: ${CYBERVPN_DATABASE_URL:-postgresql+asyncpg://cybervpn:replace-before-live@cybervpn-postgres:5432/cybervpn}
      REDIS_URL: ${CYBERVPN_REDIS_URL:-redis://cybervpn-valkey:6379/0}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      METRICS_HOST: 0.0.0.0
      METRICS_PORT: "9091"
      ENABLE_METRICS: "true"
      JSON_LOGS: "true"
      LOG_SANITIZATION_ENABLED: "true"
      SWAGGER_ENABLED: "false"
      UVICORN_ACCESS_LOG: "false"
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_IPS: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      VPN_TESTER_ENABLED: ${VPN_TESTER_ENABLED:-false}
      VPN_TESTER_RUNTIME_ENABLED: ${VPN_TESTER_RUNTIME_ENABLED:-false}
      VPN_TESTER_SYNTHETIC_USERS_ENABLED: ${VPN_TESTER_SYNTHETIC_USERS_ENABLED:-false}
      VPN_TESTER_SCHEDULED_ENABLED: ${VPN_TESTER_SCHEDULED_ENABLED:-false}
      VPN_TESTER_BALANCER_RECOMMENDATIONS_ENABLED: ${VPN_TESTER_BALANCER_RECOMMENDATIONS_ENABLED:-false}
      VPN_TESTER_RETENTION_DAYS: ${VPN_TESTER_RETENTION_DAYS:-30}
      VPN_TEST_AGENT_URL: ${VPN_TEST_AGENT_URL:-http://cybervpn-vpn-test-agent:8080}
      VPN_TEST_AGENT_SECRET: ${VPN_TEST_AGENT_SECRET:-}
      VPN_TEST_AGENT_MOSCOW_URL: ${VPN_TEST_AGENT_MOSCOW_URL:-}
      VPN_TEST_AGENT_MOSCOW_SECRET: ${VPN_TEST_AGENT_MOSCOW_SECRET:-}
      VPN_TEST_AGENT_SPB_URL: ${VPN_TEST_AGENT_SPB_URL:-}
      VPN_TEST_AGENT_SPB_SECRET: ${VPN_TEST_AGENT_SPB_SECRET:-}
      VPN_TEST_AGENT_TIMEOUT_SECONDS: ${VPN_TEST_AGENT_TIMEOUT_SECONDS:-20}
      BACKEND_INTERNAL_SECRET: ${BACKEND_INTERNAL_SECRET:-replace-before-live-backend-internal}
      TELEGRAM_BOT_INTERNAL_SECRET: ${TELEGRAM_BOT_INTERNAL_SECRET:-replace-before-live-telegram-internal}
      TELEGRAM_BOT_REGISTRATION_MODE: ${TELEGRAM_BOT_REGISTRATION_MODE:-allow_pending_onboarding}
      TELEGRAM_BOT_ALLOW_REGISTRATION_WHEN_PUBLIC_CLOSED: ${TELEGRAM_BOT_ALLOW_REGISTRATION_WHEN_PUBLIC_CLOSED:-true}
      TELEGRAM_MINIAPP_URL: ${TELEGRAM_MINIAPP_URL:-https://cyber-vpn.net/ru-RU/miniapp}
      TELEGRAM_MINIAPP_ONBOARDING_URL: ${TELEGRAM_MINIAPP_ONBOARDING_URL:-https://cyber-vpn.net/ru-RU/miniapp/onboarding/code}
      REMNAWAVE_FEATURE_XHTTP_ENABLED: ${REMNAWAVE_FEATURE_XHTTP_ENABLED:-true}
      REMNAWAVE_FEATURE_XHTTP_MIHOMO_ENABLED: ${REMNAWAVE_FEATURE_XHTTP_MIHOMO_ENABLED:-true}
      REMNAWAVE_FEATURE_XHTTP_ROLLOUT_MODE: ${REMNAWAVE_FEATURE_XHTTP_ROLLOUT_MODE:-premium_smart_ru}
      REMNAWAVE_FEATURE_XHTTP_ALLOWED_PLAN_CODES: ${REMNAWAVE_FEATURE_XHTTP_ALLOWED_PLAN_CODES:-premium_smart_ru}
      REMNAWAVE_FEATURE_XHTTP_ALLOWED_USER_SEGMENTS: ${REMNAWAVE_FEATURE_XHTTP_ALLOWED_USER_SEGMENTS:-internal,beta,premium_smart_ru_canary}
      REMNAWAVE_FEATURE_XHTTP_FORCE_DISABLED: ${REMNAWAVE_FEATURE_XHTTP_FORCE_DISABLED:-false}
      REMNAWAVE_DEFAULT_INTERNAL_SQUAD_NAME: ${REMNAWAVE_DEFAULT_INTERNAL_SQUAD_NAME:-CYBERVPN_PREMIUM_SMART_RU_NODES}
      REMNAWAVE_SPB_DE_EXCEPTIONS_PLAN_CODES: ${REMNAWAVE_SPB_DE_EXCEPTIONS_PLAN_CODES:-premium_spb_de_exceptions}
      REMNAWAVE_SPB_DE_EXCEPTIONS_PROFILE_NAME: ${REMNAWAVE_SPB_DE_EXCEPTIONS_PROFILE_NAME:-S1 SPB DE Exceptions}
      REMNAWAVE_SPB_DE_EXCEPTIONS_POLICY_VERSION: ${REMNAWAVE_SPB_DE_EXCEPTIONS_POLICY_VERSION:-premium_spb_de_exceptions.v1}
      REMNAWAVE_SPB_DE_EXCEPTIONS_DATA_PLANE_READY: ${REMNAWAVE_SPB_DE_EXCEPTIONS_DATA_PLANE_READY:-false}
      REMNAWAVE_SPB_DE_EXCEPTIONS_READINESS_ATTESTATION_PATH: /run/cybervpn/readiness/task2/attestation.jwt
      REMNAWAVE_SPB_DE_EXCEPTIONS_READINESS_PUBLIC_KEY_PATH: /run/cybervpn/readiness/task2/public-key.pem
      REMNAWAVE_SPB_DE_EXCEPTIONS_READINESS_ACTIVE_POINTER_PATH: /run/cybervpn/readiness/task2/active.json
      REMNAWAVE_SPB_DE_EXCEPTIONS_READINESS_LKG_POINTER_PATH: /run/cybervpn/readiness/task2/last-known-good.json
      REMNAWAVE_SPB_DE_EXCEPTIONS_READINESS_STORE_PATH: /run/cybervpn/readiness/task2
      REMNAWAVE_SPB_DE_EXCEPTIONS_READINESS_REVOKED_ATTESTATION_IDS: ${REMNAWAVE_SPB_DE_EXCEPTIONS_READINESS_REVOKED_ATTESTATION_IDS:-}
      REMNAWAVE_FEATURE_HYSTERIA2_ENABLED: ${REMNAWAVE_FEATURE_HYSTERIA2_ENABLED:-false}
      REMNAWAVE_FEATURE_ECH_ENABLED: ${REMNAWAVE_FEATURE_ECH_ENABLED:-false}
      REMNAWAVE_FEATURE_TUN_ENABLED: ${REMNAWAVE_FEATURE_TUN_ENABLED:-false}
      REMNAWAVE_FEATURE_V2PLUS_ENABLED: ${REMNAWAVE_FEATURE_V2PLUS_ENABLED:-false}
      REMNAWAVE_TOKEN_SCOPE_LABEL: ${REMNAWAVE_TOKEN_SCOPE_LABEL:-production-scoped}
      REMNAWAVE_TOKEN_EXPIRES_AT: ${REMNAWAVE_TOKEN_EXPIRES_AT:-}
      REMNAWAVE_TOKEN_ROTATION_WARNING_DAYS: ${REMNAWAVE_TOKEN_ROTATION_WARNING_DAYS:-14}
      RUNTIME_ORIGIN_MARKER: ${RUNTIME_ORIGIN_MARKER:-stage1-prod-a}
      RUNTIME_CONTAINER_IMAGE: ${CYBERVPN_IMAGE_REGISTRY:-local}/cybervpn-backend:${CYBERVPN_IMAGE_TAG:-stage1-beta-rc.1}
      RUNTIME_GIT_SHA: ${GIT_SHA:-}
      PAYMENT_SETTLEMENT_WORKER_SECRET: ${PAYMENT_SETTLEMENT_WORKER_SECRET:-replace-before-live-settlement-worker}
      STAGE1_ADDONS_ENABLED: ${STAGE1_ADDONS_ENABLED:-true}
      REFERRAL_ENABLED: ${REFERRAL_ENABLED:-true}
      PROMO_CODES_ENABLED: ${PROMO_CODES_ENABLED:-true}
      GIFT_CODES_ENABLED: ${GIFT_CODES_ENABLED:-true}
      CHECKOUT_CODE_DISCOUNTS_ENABLED: ${CHECKOUT_CODE_DISCOUNTS_ENABLED:-true}
      PARTNER_PORTAL_ENABLED: ${PARTNER_PORTAL_ENABLED:-true}
      PARTNER_APPLICATIONS_ENABLED: ${PARTNER_APPLICATIONS_ENABLED:-true}
      PARTNER_CODES_ENABLED: ${PARTNER_CODES_ENABLED:-true}
      PARTNER_ATTRIBUTION_ENABLED: ${PARTNER_ATTRIBUTION_ENABLED:-true}
      PARTNER_STOREFRONTS_ENABLED: ${PARTNER_STOREFRONTS_ENABLED:-true}
      PARTNER_REPORTING_ENABLED: ${PARTNER_REPORTING_ENABLED:-true}
      PARTNER_SETTLEMENT_SANDBOX_ENABLED: ${PARTNER_SETTLEMENT_SANDBOX_ENABLED:-true}
      PARTNER_WEBHOOKS_ENABLED: ${PARTNER_WEBHOOKS_ENABLED:-true}
      PARTNER_PAYOUTS_ENABLED: ${PARTNER_PAYOUTS_ENABLED:-false}
      PARTNER_EVENT_BACKBONE_ENABLED: ${PARTNER_EVENT_BACKBONE_ENABLED:-true}
      PARTNER_EXPORTS_ENABLED: ${PARTNER_EXPORTS_ENABLED:-true}
      NATS_URL: ${NATS_URL:-nats://cybervpn-nats:4222}
      PASSKEY_ENABLED: ${PASSKEY_ENABLED:-false}
      PASSKEY_CUSTOMER_ENABLED: ${PASSKEY_CUSTOMER_ENABLED:-false}
      PASSKEY_ADMIN_ENABLED: ${PASSKEY_ADMIN_ENABLED:-false}
      PASSKEY_PARTNER_ENABLED: ${PASSKEY_PARTNER_ENABLED:-false}
      PASSKEY_CONDITIONAL_UI_ENABLED: ${PASSKEY_CONDITIONAL_UI_ENABLED:-false}
      PASSKEY_CUSTOMER_REGISTRATION_PROMPT_ENABLED: ${PASSKEY_CUSTOMER_REGISTRATION_PROMPT_ENABLED:-false}
      PASSKEY_ADMIN_SECURITY_DASHBOARD_ENABLED: ${PASSKEY_ADMIN_SECURITY_DASHBOARD_ENABLED:-false}
      PASSKEY_PARTNER_WORKSPACE_POLICY_ENABLED: ${PASSKEY_PARTNER_WORKSPACE_POLICY_ENABLED:-false}
      PASSKEY_RP_ID: ${PASSKEY_RP_ID:-cyber-vpn.net}
      PASSKEY_RP_NAME: ${PASSKEY_RP_NAME:-CyberVPN}
      PASSKEY_ALLOWED_ORIGINS: ${PASSKEY_ALLOWED_ORIGINS:-https://cyber-vpn.net,https://my.cyber-vpn.net,https://admin.cyber-vpn.net,https://partner.cyber-vpn.net}
    depends_on:
      cybervpn-nats:
        condition: service_healthy
    volumes:
      - ${CYBERVPN_READINESS_DIR:-/srv/cybervpn/readiness}/task2:/run/cybervpn/readiness/task2:ro
    networks:
      cybervpn-backend: {}
      cybervpn-data: {}
      cybervpn-metrics: {}
      cybervpn-egress: {}
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 768m
    cpus: "1.00"
    pids_limit: 256
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-backend
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "9091"
      prometheus.job: cybervpn-backend
      prometheus.service: cybervpn-backend

  cybervpn-vpn-test-agent:
    <<: *runtime-defaults
    image: ${CYBERVPN_IMAGE_REGISTRY:-local}/cybervpn-vpn-test-agent:${CYBERVPN_IMAGE_TAG:-stage1-beta-rc.1}
    expose:
      - "8080"
    environment:
      VPN_TEST_AGENT_SECRET: ${VPN_TEST_AGENT_SECRET:-}
      VPN_TEST_AGENT_ID: ${VPN_TEST_AGENT_ID:-stage1-vpn-test-agent}
      VPN_TEST_AGENT_PROXY_ONLY_ENABLED: ${VPN_TEST_AGENT_PROXY_ONLY_ENABLED:-true}
      VPN_TEST_AGENT_TUN_ENABLED: ${VPN_TEST_AGENT_TUN_ENABLED:-false}
      VPN_TEST_AGENT_PROFILE_MAX_ATTEMPTS: ${VPN_TEST_AGENT_PROFILE_MAX_ATTEMPTS:-3}
      VPN_TEST_AGENT_PROFILE_RETRY_BACKOFF_SECONDS: ${VPN_TEST_AGENT_PROFILE_RETRY_BACKOFF_SECONDS:-0.75}
      LOG_LEVEL: INFO
    networks:
      cybervpn-backend: {}
      cybervpn-egress: {}
    read_only: true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "python healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-vpn-test-agent
      cybervpn.metrics.target: internal_vpn_test_agent

  cybervpn-worker:
    <<: *runtime-defaults
    image: ${CYBERVPN_IMAGE_REGISTRY:-local}/cybervpn-task-worker:${CYBERVPN_IMAGE_TAG:-stage1-beta-rc.1}
    command:
      - sh
      - -lc
      - mkdir -p "$${PROMETHEUS_MULTIPROC_DIR:-/tmp/prometheus-multiproc}" && exec taskiq worker src.broker:broker --workers 1 --fs-discover
    env_file:
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/app.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/telegram-bot.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/payments.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/remnawave.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/sentry-runtime.env
        required: false
    expose:
      - "9091"
    environment:
      DATABASE_URL: ${CYBERVPN_DATABASE_URL:-postgresql+asyncpg://cybervpn:replace-before-live@cybervpn-postgres:5432/cybervpn}
      REDIS_URL: ${CYBERVPN_REDIS_URL:-redis://cybervpn-valkey:6379/0}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      METRICS_ENABLED: "true"
      METRICS_PROTECT: "false"
      METRICS_PORT: "9091"
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
      HELIX_ENABLED: "false"
      VPN_TESTER_ENABLED: ${VPN_TESTER_ENABLED:-false}
      VPN_TESTER_RUNTIME_ENABLED: ${VPN_TESTER_RUNTIME_ENABLED:-false}
      VPN_TESTER_SYNTHETIC_USERS_ENABLED: ${VPN_TESTER_SYNTHETIC_USERS_ENABLED:-false}
      VPN_TESTER_SCHEDULED_ENABLED: ${VPN_TESTER_SCHEDULED_ENABLED:-false}
      VPN_TESTER_BALANCER_RECOMMENDATIONS_ENABLED: ${VPN_TESTER_BALANCER_RECOMMENDATIONS_ENABLED:-false}
      VPN_TESTER_QUEUE_BATCH_LIMIT: ${VPN_TESTER_QUEUE_BATCH_LIMIT:-5}
      VPN_TESTER_LOCK_TTL_SECONDS: ${VPN_TESTER_LOCK_TTL_SECONDS:-600}
      VPN_TEST_AGENT_MOSCOW_URL: ${VPN_TEST_AGENT_MOSCOW_URL:-}
      VPN_TEST_AGENT_MOSCOW_SECRET: ${VPN_TEST_AGENT_MOSCOW_SECRET:-}
      VPN_TEST_AGENT_SPB_URL: ${VPN_TEST_AGENT_SPB_URL:-}
      VPN_TEST_AGENT_SPB_SECRET: ${VPN_TEST_AGENT_SPB_SECRET:-}
      BACKEND_API_URL: http://cybervpn-backend:8000/api/v1
      BACKEND_INTERNAL_SECRET: ${BACKEND_INTERNAL_SECRET:-replace-before-live-backend-internal}
      TELEGRAM_BOT_INTERNAL_SECRET: ${TELEGRAM_BOT_INTERNAL_SECRET:-replace-before-live-telegram-internal}
      PAYMENT_SETTLEMENT_WORKER_SECRET: ${PAYMENT_SETTLEMENT_WORKER_SECRET:-replace-before-live-settlement-worker}
      STAGE1_ADDONS_ENABLED: ${STAGE1_ADDONS_ENABLED:-true}
      REFERRAL_ENABLED: ${REFERRAL_ENABLED:-true}
      PROMO_CODES_ENABLED: ${PROMO_CODES_ENABLED:-true}
      GIFT_CODES_ENABLED: ${GIFT_CODES_ENABLED:-true}
      CHECKOUT_CODE_DISCOUNTS_ENABLED: ${CHECKOUT_CODE_DISCOUNTS_ENABLED:-true}
      PARTNER_PORTAL_ENABLED: ${PARTNER_PORTAL_ENABLED:-true}
      PARTNER_APPLICATIONS_ENABLED: ${PARTNER_APPLICATIONS_ENABLED:-true}
      PARTNER_CODES_ENABLED: ${PARTNER_CODES_ENABLED:-true}
      PARTNER_ATTRIBUTION_ENABLED: ${PARTNER_ATTRIBUTION_ENABLED:-true}
      PARTNER_STOREFRONTS_ENABLED: ${PARTNER_STOREFRONTS_ENABLED:-true}
      PARTNER_REPORTING_ENABLED: ${PARTNER_REPORTING_ENABLED:-true}
      PARTNER_SETTLEMENT_SANDBOX_ENABLED: ${PARTNER_SETTLEMENT_SANDBOX_ENABLED:-true}
      PARTNER_WEBHOOKS_ENABLED: ${PARTNER_WEBHOOKS_ENABLED:-true}
      PARTNER_PAYOUTS_ENABLED: ${PARTNER_PAYOUTS_ENABLED:-false}
      PARTNER_EVENT_BACKBONE_ENABLED: ${PARTNER_EVENT_BACKBONE_ENABLED:-true}
      PARTNER_EXPORTS_ENABLED: ${PARTNER_EXPORTS_ENABLED:-true}
    networks:
      cybervpn-backend: {}
      cybervpn-data: {}
      cybervpn-metrics: {}
      cybervpn-egress: {}
    tmpfs:
      - /tmp:size=256m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os, redis; client=redis.from_url(os.environ['REDIS_URL'], socket_connect_timeout=5, socket_timeout=5); client.ping(); client.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: "1.00"
    pids_limit: 256
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-worker
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "9091"
      prometheus.job: cybervpn-worker
      prometheus.service: cybervpn-worker

  cybervpn-scheduler:
    <<: *runtime-defaults
    image: ${CYBERVPN_IMAGE_REGISTRY:-local}/cybervpn-task-worker:${CYBERVPN_IMAGE_TAG:-stage1-beta-rc.1}
    command: ["taskiq", "scheduler", "src.broker:scheduler"]
    env_file:
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/app.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/telegram-bot.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/payments.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/remnawave.env
        required: false
      - path: ${CYBERVPN_SECRETS_DIR:-/srv/cybervpn-h/secrets}/sentry-runtime.env
        required: false
    environment:
      DATABASE_URL: ${CYBERVPN_DATABASE_URL:-postgresql+asyncpg://cybervpn:replace-before-live@cybervpn-postgres:5432/cybervpn}
      REDIS_URL: ${CYBERVPN_REDIS_URL:-redis://cybervpn-valkey:6379/0}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      METRICS_ENABLED: "false"
      METRICS_PROTECT: "false"
      HELIX_ENABLED: "false"
      VPN_TESTER_ENABLED: ${VPN_TESTER_ENABLED:-false}
      VPN_TESTER_RUNTIME_ENABLED: ${VPN_TESTER_RUNTIME_ENABLED:-false}
      VPN_TESTER_SYNTHETIC_USERS_ENABLED: ${VPN_TESTER_SYNTHETIC_USERS_ENABLED:-false}
      VPN_TESTER_SCHEDULED_ENABLED: ${VPN_TESTER_SCHEDULED_ENABLED:-false}
      VPN_TESTER_BALANCER_RECOMMENDATIONS_ENABLED: ${VPN_TESTER_BALANCER_RECOMMENDATIONS_ENABLED:-false}
      VPN_TESTER_QUEUE_BATCH_LIMIT: ${VPN_TESTER_QUEUE_BATCH_LIMIT:-5}
      VPN_TESTER_LOCK_TTL_SECONDS: ${VPN_TESTER_LOCK_TTL_SECONDS:-600}
      VPN_TEST_AGENT_MOSCOW_URL: ${VPN_TEST_AGENT_MOSCOW_URL:-}
      VPN_TEST_AGENT_MOSCOW_SECRET: ${VPN_TEST_AGENT_MOSCOW_SECRET:-}
      VPN_TEST_AGENT_SPB_URL: ${VPN_TEST_AGENT_SPB_URL:-}
      VPN_TEST_AGENT_SPB_SECRET: ${VPN_TEST_AGENT_SPB_SECRET:-}
      BACKEND_API_URL: http://cybervpn-backend:8000/api/v1
      BACKEND_INTERNAL_SECRET: ${BACKEND_INTERNAL_SECRET:-replace-before-live-backend-internal}
      TELEGRAM_BOT_INTERNAL_SECRET: ${TELEGRAM_BOT_INTERNAL_SECRET:-replace-before-live-telegram-internal}
      PAYMENT_SETTLEMENT_WORKER_SECRET: ${PAYMENT_SETTLEMENT_WORKER_SECRET:-replace-before-live-settlement-worker}
      STAGE1_ADDONS_ENABLED: ${STAGE1_ADDONS_ENABLED:-true}
      REFERRAL_ENABLED: ${REFERRAL_ENABLED:-true}
      PROMO_CODES_ENABLED: ${PROMO_CODES_ENABLED:-true}
      GIFT_CODES_ENABLED: ${GIFT_CODES_ENABLED:-true}
      CHECKOUT_CODE_DISCOUNTS_ENABLED: ${CHECKOUT_CODE_DISCOUNTS_ENABLED:-true}
      PARTNER_PORTAL_ENABLED: ${PARTNER_PORTAL_ENABLED:-true}
      PARTNER_APPLICATIONS_ENABLED: ${PARTNER_APPLICATIONS_ENABLED:-true}
      PARTNER_CODES_ENABLED: ${PARTNER_CODES_ENABLED:-true}
      PARTNER_ATTRIBUTION_ENABLED: ${PARTNER_ATTRIBUTION_ENABLED:-true}
      PARTNER_STOREFRONTS_ENABLED: ${PARTNER_STOREFRONTS_ENABLED:-true}
      PARTNER_REPORTING_ENABLED: ${PARTNER_REPORTING_ENABLED:-true}
      PARTNER_SETTLEMENT_SANDBOX_ENABLED: ${PARTNER_SETTLEMENT_SANDBOX_ENABLED:-true}
      PARTNER_WEBHOOKS_ENABLED: ${PARTNER_WEBHOOKS_ENABLED:-true}
      PARTNER_PAYOUTS_ENABLED: ${PARTNER_PAYOUTS_ENABLED:-false}
      PARTNER_EVENT_BACKBONE_ENABLED: ${PARTNER_EVENT_BACKBONE_ENABLED:-true}
