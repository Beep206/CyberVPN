      TELEGRAM_BOT_MENU_BUTTON: ${TELEGRAM_BOT_MENU_BUTTON:-miniapp}
      RUNTIME_ORIGIN_MARKER: ${RUNTIME_ORIGIN_MARKER:-stage1-prod-a}
      RUNTIME_CONTAINER_IMAGE: ${CYBERVPN_IMAGE_REGISTRY:-local}/cybervpn-telegram-bot:${CYBERVPN_IMAGE_TAG:-stage1-beta-rc.1}
      RUNTIME_GIT_SHA: ${GIT_SHA:-}
      REDIS_URL: ${CYBERVPN_BOT_REDIS_URL:-redis://cybervpn-valkey:6379}
