  cybervpn-postgres:
    <<: *runtime-defaults
    profiles: ["local-data"]
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: ${CYBERVPN_POSTGRES_DB:-cybervpn}
      POSTGRES_USER: ${CYBERVPN_POSTGRES_USER:-cybervpn}
      POSTGRES_PASSWORD: ${CYBERVPN_POSTGRES_PASSWORD:-replace-before-live}
      TZ: UTC
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
    volumes:
      - cybervpn-postgres-data:/var/lib/postgresql/data
    networks:
      cybervpn-data:
        aliases:
          - remnawave-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 1g
    cpus: "1.00"
    pids_limit: 256
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-postgres
      cybervpn.metrics.target: postgres_exporter

  cybervpn-valkey:
    <<: *runtime-defaults
    profiles: ["local-data"]
    image: valkey/valkey:8.1.8-alpine
    command: >
      valkey-server
      --save ""
      --appendonly no
      --maxmemory ${CYBERVPN_VALKEY_MAXMEMORY:-256mb}
      --maxmemory-policy noeviction
      --loglevel warning
    networks:
      cybervpn-data:
        aliases:
          - remnawave-redis
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 384m
    cpus: "0.50"
    pids_limit: 128
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-valkey
      cybervpn.metrics.target: redis_exporter

  cybervpn-postgres-exporter:
    <<: *runtime-defaults
    profiles: ["local-data"]
    image: prometheuscommunity/postgres-exporter:v0.20.0
    environment:
      DATA_SOURCE_NAME: postgresql://${CYBERVPN_POSTGRES_USER:-cybervpn}:${CYBERVPN_POSTGRES_PASSWORD:-replace-before-live}@cybervpn-postgres:5432/${CYBERVPN_POSTGRES_DB:-cybervpn}?sslmode=disable
    expose:
      - "9187"
    depends_on:
      cybervpn-postgres:
        condition: service_healthy
    networks:
      cybervpn-data: {}
      cybervpn-metrics: {}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9187/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 128
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-postgres-exporter
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "9187"
      prometheus.job: postgres
      prometheus.service: cybervpn-postgres

  cybervpn-redis-exporter:
    <<: *runtime-defaults
    profiles: ["local-data"]
    image: oliver006/redis_exporter:v1.86.0-alpine
    environment:
      REDIS_ADDR: redis://cybervpn-valkey:6379
    expose:
      - "9121"
    depends_on:
      cybervpn-valkey:
        condition: service_healthy
    networks:
      cybervpn-data: {}
      cybervpn-metrics: {}
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:9121/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 128m
    cpus: "0.25"
    pids_limit: 128
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-redis-exporter
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "9121"
      prometheus.job: redis
      prometheus.service: cybervpn-valkey

  cybervpn-nats:
    <<: *runtime-defaults
    image: nats:2.14.3-alpine
    command:
      - -js
      - -sd
      - /data/jetstream
      - -m
      - "8222"
    expose:
      - "4222"
      - "8222"
    volumes:
      - cybervpn-nats-jetstream:/data/jetstream
    networks:
      cybervpn-backend: {}
      cybervpn-metrics: {}
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-nats
      prometheus.io/scrape: "true"
      prometheus.io/path: /varz
      prometheus.io/port: "8222"
      prometheus.job: nats
      prometheus.service: cybervpn-nats

