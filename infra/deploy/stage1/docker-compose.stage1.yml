      LOG_JSON_FORMAT: "true"
    networks:
      cybervpn-backend: {}
      cybervpn-data: {}
      cybervpn-metrics: {}
      cybervpn-egress: {}
    tmpfs:
      - /tmp:size=128m,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    cpus: "0.75"
    pids_limit: 192
    labels:
      <<: *stage-labels
      cybervpn.service: cybervpn-telegram-bot
      prometheus.io/scrape: "true"
      prometheus.io/path: /metrics
      prometheus.io/port: "8080"
      prometheus.job: cybervpn-telegram-bot
      prometheus.service: cybervpn-telegram-bot

  cybervpn-frontend:
