name: cybervpn-stage1-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: cybervpn-stage1-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGE1_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${STAGE1_PROMETHEUS_RETENTION:-15d}"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      cybervpn-monitoring:
        aliases:
          - prometheus
      cybervpn-backend: {}
      cybervpn-metrics: {}
    mem_limit: 768m
    cpus: "0.75"
    pids_limit: 256

  grafana:
    image: grafana/grafana:11.5.2
    container_name: cybervpn-stage1-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGE1_GRAFANA_PORT:-3002}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SERVER_ROOT_URL: ${STAGE1_GRAFANA_ROOT_URL:-http://127.0.0.1:3002}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      cybervpn-monitoring: {}
    mem_limit: 512m
    cpus: "0.50"
    pids_limit: 256

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: cybervpn-stage1-alertmanager
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STAGE1_ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--web.external-url=${STAGE1_ALERTMANAGER_ROOT_URL:-http://127.0.0.1:9093}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      cybervpn-monitoring:
        aliases:
          - alertmanager
    mem_limit: 256m
    cpus: "0.25"
    pids_limit: 128

networks:
  cybervpn-monitoring:
    name: cybervpn_stage1_monitoring
  cybervpn-backend:
    external: true
    name: cybervpn_stage1_backend
  cybervpn-metrics:
    external: true
    name: cybervpn_stage1_metrics

volumes:
  prometheus-data:
    name: cybervpn_stage1_prometheus_data
  grafana-data:
    name: cybervpn_stage1_grafana_data
  alertmanager-data:
    name: cybervpn_stage1_alertmanager_data
