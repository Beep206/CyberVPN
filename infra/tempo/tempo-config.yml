server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: 168h  # 7 days
        compacted_block_retention: 1h
        compaction_window: 1h
        max_block_bytes: 107374182400  # 100GB
        retention_concurrency: 10

backend_worker:
  compaction:
    block_retention: 168h  # 7 days
    compacted_block_retention: 1h
    compaction_window: 1h
    max_block_bytes: 107374182400  # 100GB
    retention_concurrency: 10

cache:
  caches:
    - roles:
        - bloom
        - trace-id-index
        - parquet-footer
        - parquet-column-idx
        - parquet-offset-idx
        - frontend-search
      redis:
        endpoint: remnawave-redis:6379
        timeout: 100ms

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

querier:
  max_concurrent_queries: 20

query_frontend:
  search:
    max_result_limit: 20

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: local
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      generate_native_histograms: both

usage_report:
  reporting_enabled: false
