source_groups:
  private_networks: [private-ips, geosite-private]
  direct_processes: [direct-processes, remote-control]
  bittorrent_protocol: [bittorrent-protocol]
  torrent_processes: [torrent-processes]
  torrent_sources: [torrent-clients, torrent-trackers, torrent-websites, torrent-domains-inline]
  ads_trackers: [oisd-big, ads-all, win-spy, tracker-domains-inline]
  tor: [tor-inline, tor-processes]
  quic_doq: [quic-doq]
  smtp_abuse: [smtp-abuse]
  eu_exceptions:
    - manual-eu-inline
    - youtube
    - discord-domains
    - discord-voice
    - cloudflare-ips
    - telegram-domains
    - telegram-ips
    - additional-telegram-domains
    - additional-telegram-ips
    - whatsapp
    - meta-ips
    - ai
    - google-deepmind
    - github
    - ru-eu-exceptions
    - ru-inside
    - refilter-domains
    - refilter-ipsum
    - ru-bundle
    - rknasnblock
  ru_services: [ru-services-inline, ru-apps]
  broad_ru: [geosite-ru, geoip-for-ru]

rules:
  - {id: direct_private, stage: private_networks, action: direct, source_group: private_networks}
  - {id: direct_approved_processes, stage: direct_processes, action: direct, source_group: direct_processes}
  - {id: block_bittorrent_protocol, stage: bittorrent_protocol, action: block, source_group: bittorrent_protocol}
  - {id: block_torrent_processes, stage: torrent_processes, action: block, source_group: torrent_processes}
  - {id: block_torrent_sources, stage: torrent_sources, action: block, source_group: torrent_sources}
  - {id: block_ads_trackers, stage: ads_trackers, action: block, source_group: ads_trackers}
  - {id: block_tor_best_effort, stage: tor, action: block, source_group: tor, assurance: best_effort}
  - {id: block_quic_doq, stage: quic_doq, action: block, source_group: quic_doq}
  - {id: block_smtp_abuse, stage: smtp_abuse, action: block, source_group: smtp_abuse}
  - {id: route_eu_exceptions, stage: eu_exceptions, action: eu, source_group: eu_exceptions}
  - {id: route_ru_services, stage: ru_services, action: ru, source_group: ru_services}
  - {id: route_broad_ru, stage: broad_ru, action: ru, source_group: broad_ru}
  - {id: route_final_eu, stage: final, action: eu, network: "tcp,udp"}
