version: 1
product: premium_smart_ru

routes:
  private: direct
  default: eu
  ru_services: ru
  eu_exceptions: eu

blocks:
  ads: true
  trackers: true
  torrent: true
  tor: best_effort
  quic_doq: block
  smtp_abuse_ports: [25, 465, 587]

regions:
  eu:
    primary: de
    fallback: nl
  ru:
    primary: spb
    fallback: moscow

transport_groups:
  eu:
    primary: de
    fallback: nl
    primary_transport: xhttp
    fallback_transport: xhttp
    members:
      de: [raw, xhttp]
      nl: [raw, xhttp]
    health:
      probe_url: https://www.gstatic.com/generate_204
      expected_status: 204
      interval_seconds: 300
      lazy: true
      transport_checks: independent
      constrain_probe_to_region: true
    degraded:
      on_primary_unavailable: use_fallback
      on_fallback_unavailable: use_primary_if_healthy
      on_all_unavailable: explicit_degraded
      cross_region_fallback: false
      event: premium_smart_ru.eu.degraded
      metric: premium_smart_ru_eu_degraded
  ru:
    primary: spb
    fallback: moscow
    primary_transport: xhttp
    fallback_transport: xhttp
    members:
      moscow: [raw, xhttp]
      spb: [raw, xhttp]
    health:
      probe_url: https://www.ozon.ru/
      expected_status: 307
      interval_seconds: 60
      lazy: true
      transport_checks: independent
      constrain_probe_to_region: true
    degraded:
      on_primary_unavailable: use_fallback
      on_fallback_unavailable: use_primary_if_healthy
      on_all_unavailable: explicit_degraded
      cross_region_fallback: false
      event: premium_smart_ru.ru.degraded
      metric: premium_smart_ru_ru_degraded

