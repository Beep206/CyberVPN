[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cybervpn-vpn-test-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.135.3",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "uvicorn[standard]==0.44.0",
    "structlog>=24.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/main.py" = ["S104"]
